[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapingdog"
version = "1.0.0"
description = "Python SDK for the Scrapingdog web scraping and SERP APIs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Scrapingdog" }]
keywords = ["scrapingdog", "web scraping", "serp", "google", "amazon", "proxy", "api"]
dependencies = ["requests>=2.20"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.scrapingdog.com"
Documentation = "https://www.scrapingdog.com/documentation/"

[project.optional-dependencies]
test = ["pytest>=7", "responses>=0.23"]

[tool.setuptools.packages.find]
include = ["scrapingdog*"]
